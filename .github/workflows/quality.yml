name: Quality
on:
  push:
  pull_request:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: composer validate --working-dir=core/components/webpush --no-check-publish
      - run: composer install --working-dir=core/components/webpush --no-interaction --prefer-dist
      - run: find core assets _build -name '*.php' -print0 | xargs -0 -n1 php -l
