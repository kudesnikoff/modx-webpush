name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-lint-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate dependencies
        run: composer validate --working-dir=core/components/webpush --no-check-publish
      - name: Install dependencies
        run: composer install --working-dir=core/components/webpush --no-interaction --prefer-dist --no-progress
      - name: PHP syntax check
        run: find core assets _build tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Security regression smoke tests
        run: php tests/security-smoke.php
