name: PHP Security

on:
  push:
    branches: [main, beta2]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep PHP security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep
      - name: Scan PHP and JavaScript
        run: semgrep scan --error --metrics=off --config=p/php --config=p/security-audit --exclude=core/components/webpush/vendor .

  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate Composer manifest
        working-directory: core/components/webpush
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        working-directory: core/components/webpush
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit dependencies
        working-directory: core/components/webpush
        run: composer audit --locked
